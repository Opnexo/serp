[project]
name = "serp-shell"
version = "1.0.0"
description = "Application shell for SimpleERP - FastAPI runtime and module orchestration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SimpleERP Team", email = "team@simpleerp.dev" }]
license = { text = "MIT" }
keywords = ["erp", "fastapi", "api", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "serp-core>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.26.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
# Modules are optional - installed per environment
modules = [
    "serp-pm",
]

[project.scripts]
serp = "serp_shell.cli.commands:main"

[project.urls]
Homepage = "https://github.com/simpleerp/serp"
Documentation = "https://docs.simpleerp.dev"
Repository = "https://github.com/simpleerp/serp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serp_shell"]

[project]
name = "serp-core"
version = "1.0.0"
description = "Core foundation for SimpleERP platform - DDD patterns, plugin system, and base classes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SimpleERP Team", email = "team@simpleerp.dev" }]
license = { text = "MIT" }
keywords = ["erp", "ddd", "plugins", "modular", "enterprise"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
telemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
telemetry-jaeger = [
    "opentelemetry-exporter-jaeger>=1.20.0",
]
telemetry-zipkin = [
    "opentelemetry-exporter-zipkin>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/simpleerp/serp"
Documentation = "https://docs.simpleerp.dev"
Repository = "https://github.com/simpleerp/serp"
Issues = "https://github.com/simpleerp/serp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serp_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["serp_core"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

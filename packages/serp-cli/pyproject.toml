[project]
name = "serp-cli"
version = "1.0.0"
description = "Developer CLI tools and code generators for SimpleERP modules"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SimpleERP Team", email = "team@simpleerp.dev" }]
license = { text = "MIT" }
keywords = ["erp", "cli", "generator", "scaffolding", "development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]

dependencies = [
    "serp-core>=1.0.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "inflect>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[project.scripts]
serp-cli = "serp_cli.cli:main"

[project.urls]
Homepage = "https://github.com/simpleerp/serp"
Documentation = "https://docs.simpleerp.dev"
Repository = "https://github.com/simpleerp/serp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serp_cli"]

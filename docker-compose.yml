# SimpleERP Development Environment
# Usage:
#   Start all services:     docker compose up -d
#   Stop all services:      docker compose down
#   View logs:              docker compose logs -f
#   Reset database:         docker compose down -v && docker compose up -d
#
# Services:
#   - PostgreSQL:     localhost:5432 (user: serp, password: serp, db: serp)
#   - pgAdmin:        http://localhost:5050 (admin@serp.dev / admin)
#   - Redis:          localhost:6379
#   - Kafka:          localhost:9092
#   - Kafka UI:       http://localhost:8080

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: serp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serp
      POSTGRES_PASSWORD: serp
      POSTGRES_DB: serp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U serp -d serp" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # pgAdmin - Database Management UI
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: serp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@serp.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================
  # Redis - Cache & Session Store
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: serp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  # ===========================================
  # Kafka - Event Streaming (with KRaft, no Zookeeper)
  # ===========================================

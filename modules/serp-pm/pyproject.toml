[project]
name = "serp-pm"
version = "0.1.0"
description = "SERP Project Management Core Module - Foundational PM for methodology extensions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SERP Team", email = "team@simpleerp.dev" }]
keywords = ["serp", "erp", "project-management", "task-management", "agile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "serp-core",
    "serp-resources",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dateutil>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.entry-points."serp.modules"]
pm = "serp_pm:MODULE_INFO"

[project.entry-points."serp.modules.ui"]
pm = "serp_pm.ui:load_ui_config"

[project.entry-points."serp.modules.api"]
pm = "serp_pm.interfaces.api.routes:load_api_routes"

[project.entry-points."serp.pm.project_types"]
generic = "serp_pm.types.generic:GenericProjectType"
kanban = "serp_pm.types.kanban:KanbanProjectType"
scrum = "serp_pm.types.scrum:ScrumProjectType"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serp_pm"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
